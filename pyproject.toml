[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle"
version = "0.1.0"
description = "AI + ML + Deterministic + Non-Deterministic Prediction Engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "httpx>=0.25",
    "jinja2>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]